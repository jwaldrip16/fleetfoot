{% extends "base.html" %}{% block body %}
<div class="head">
  <h1>Dispatch board</h1>
  <div><a class="btn small" href="/dispatch/restaurants">Restaurant hours</a>
       <a class="btn small" href="/dispatch/settings">Fees</a>
       <a class="btn small" href="/dispatch/logout">Sign out</a></div>
</div>
<div class="cols3">
  <section><h2>Drivers</h2><div id="drivers"></div>
    <h2>Dispatch chat</h2>
    <select id="chatDriver" onchange="loadChat()"></select>
    <div id="chat" class="chat"></div>
    <div class="row"><input id="chatBox" placeholder="Message the driver"
         onkeydown="if(event.key==='Enter')send()"><button class="btn" onclick="send()">Send</button></div>
  </section>
  <section class="wide"><div id="orders"></div>
    <div class="tabs"><button class="tab on" id="tabLive" onclick="tab('live')">Live orders</button>
      <button class="tab" id="tabDone" onclick="tab('done')">Completed orders</button></div>
    <div id="completed" class="hidden"></div></section>
</div>
{% endblock %}
{% block scripts %}<script>
let DRIVERS = [];
async function board(){
  const res = await jget('/api/dispatch/board');
  if(!res.ok){ window.location='/dispatch/login'; return; }
  DRIVERS = res.drivers;
  document.getElementById('drivers').innerHTML = res.drivers.map(d=>{
    const req = d.pending_request ? '<div class="pill amber">Requests: '+d.pending_request+'</div>' : '';
    return '<div class="driver"><div><strong>'+d.name+'</strong> <span class="pill '+
      (d.status==='online'?'green':d.status==='break'?'amber':'grey')+'">'+d.status+'</span>'+
      '<div class="muted small">'+d.phone+' &middot; '+d.load+'/'+d.max_stack+' orders stacked</div>'+req+'</div>'+
      '<div><button class="btn tiny" onclick="setStatus('+d.id+',\'online\')">Online</button>'+
      '<button class="btn tiny" onclick="setStatus('+d.id+',\'break\')">Break</button>'+
      '<button class="btn tiny" onclick="setStatus('+d.id+',\'offline\')">Off</button></div></div>';
  }).join('');
  const sel = document.getElementById('chatDriver');
  if (sel.options.length !== res.drivers.length)
    sel.innerHTML = res.drivers.map(d=>'<option value="'+d.id+'">'+d.name+'</option>').join('');
  const opts = '<option value="">Unassigned</option>' +
    res.drivers.filter(d=>d.status==='online').map(d=>'<option value="'+d.id+'">'+d.name+'</option>').join('');
  document.getElementById('orders').innerHTML = res.orders.map(o=>orderCard(o,opts)).join('') ||
    '<p class="muted">No live orders.</p>';
  res.orders.forEach(o=>{ const s=document.getElementById('as'+o.id); if(s) s.value = o.driver_id||''; });
  document.getElementById('completed').innerHTML = (res.completed||[]).map(o=>
    '<div class="order"><div class="order-head"><strong>'+o.code+'</strong> <span class="pill '+
    (o.dispatch_status==='delivered'?'green':'grey')+'">'+o.dispatch_status+'</span> '+
    '<span class="muted small">'+(o.delivered_at||'').replace('T',' ')+'</span></div>'+
    '<div class="muted small">'+o.restaurant+' &rarr; '+o.customer+' &middot; '+o.address+
    ' &middot; '+o.miles+' mi &middot; fee '+o.fee+' &middot; total '+o.total+
    (o.driver?' &middot; driver '+o.driver:'')+'</div></div>').join('') ||
    '<p class="muted">Nothing completed yet.</p>';
}
function orderCard(o, opts){
  const timer = (o.timer_seconds!==null && o.kitchen_status==='preparing')
    ? '<span class="pill amber">'+Math.max(0,Math.ceil(o.timer_seconds/60))+' min</span>' : '';
  const q = o.queue_position ? '<span class="pill blue">Queue #'+o.queue_position+'</span>' : '';
  const hold = o.hold_reason ? '<span class="pill grey">'+o.hold_reason+'</span>' : '';
  return '<div class="order"><div class="order-head"><strong>'+o.code+'</strong> '+
    '<span class="pill '+(o.kitchen_status==='ready'?'green':o.kitchen_status==='preparing'?'amber':'grey')+'">'
    +o.kitchen_status+'</span> <span class="pill blue">'+o.dispatch_status+'</span> '+timer+' '+q+' '+hold+
    (o.placed_by!=='customer' ? ' <span class="pill grey">by '+o.placed_by+'</span>' : '')+'</div>'+
    '<div class="muted small">'+o.restaurant+' &rarr; '+o.customer+' &middot; '+o.address+
    ' &middot; '+o.miles+' mi &middot; fee '+o.fee+' &middot; total '+o.total+'</div>'+
    '<div class="muted small">'+o.items.map(i=>i.qty+'x '+i.name).join(', ')+'</div>'+
    '<div class="order-actions">'+
      '<button class="btn tiny" onclick="kitchen('+o.id+',\'preparing\')">Start timer</button>'+
      '<input class="mins" id="m'+o.id+'" type="number" value="'+(o.prep_minutes||15)+'" min="1" max="90">'+
      '<button class="btn tiny" onclick="kitchen('+o.id+',\'ready\')">Mark ready</button>'+
      '<select id="as'+o.id+'" onchange="assign('+o.id+',this.value)">'+opts+'</select>'+
      '<button class="btn tiny" onclick="dstat('+o.id+',\'received\')">Received</button>'+
      '<button class="btn tiny" onclick="dstat('+o.id+',\'at_restaurant\')">At rest</button>'+
      '<button class="btn tiny" onclick="dstat('+o.id+',\'enroute\')">Enroute</button>'+
      '<button class="btn tiny" onclick="complete('+o.id+',\''+o.code+'\')">Complete</button>'+
      '<button class="btn tiny" onclick="hold('+o.id+')">Hold</button>'+
      '<a class="btn tiny" target="_blank" href="'+o.customer_nav+'">Nav</a>'+
    '</div></div>';
}
async function kitchen(id, st){
  const mins = document.getElementById('m'+id).value;
  await jpost('/api/order/status', {order_id:id, kitchen_status:st, prep_minutes:mins}); board();
}
async function dstat(id, st){ await jpost('/api/order/status', {order_id:id, dispatch_status:st}); board(); }
async function complete(id, code){
  if(!confirm('Marking '+code+' complete closes the order and moves it to completed orders. '+
              'The driver slot frees up for the next stop. Continue?')) return;
  await jpost('/api/order/status', {order_id:id, dispatch_status:'delivered'}); board();
}
async function assign(id, did){ await jpost('/api/dispatch/assign', {order_id:id, driver_id:did||null}); board(); }
async function hold(id){ await jpost('/api/order/hold', {order_id:id, reason:'held by dispatch'}); board(); }
async function setStatus(id, st){ await jpost('/api/dispatch/driver-status', {driver_id:id, status:st}); board(); }
async function loadChat(){
  const id = document.getElementById('chatDriver').value; if(!id) return;
  const res = await jget('/api/chat/'+id);
  document.getElementById('chat').innerHTML = res.messages.map(m=>
    '<div class="msg '+m.sender+'"><span class="muted small">'+m.at+' '+m.sender+'</span><div>'+m.body+'</div></div>'
  ).join('');
  const c = document.getElementById('chat'); c.scrollTop = c.scrollHeight;
}
async function send(){
  const id = document.getElementById('chatDriver').value;
  const box = document.getElementById('chatBox');
  if(!box.value.trim()) return;
  await jpost('/api/chat/'+id, {sender:'dispatch', body:box.value});
  box.value=''; loadChat();
}
function tab(which){
  const live = which==='live';
  document.getElementById('orders').classList.toggle('hidden', !live);
  document.getElementById('completed').classList.toggle('hidden', live);
  document.getElementById('tabLive').classList.toggle('on', live);
  document.getElementById('tabDone').classList.toggle('on', !live);
}
board(); setTimeout(loadChat, 400);
setInterval(board, 4000); setInterval(loadChat, 4000);
</script>{% endblock %}
